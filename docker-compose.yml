# =============================================================================
# ICNV Cerâmica — docker-compose (app + MySQL + volume de uploads)
# Uso local:  docker compose up -d --build
# EasyPanel:  pode usar só o Dockerfile do app e um serviço MySQL separado,
#             ou importar este compose se o painel permitir.
# =============================================================================

services:
  db:
    image: mysql:8.4
    container_name: icnv-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_troque_esta_senha}
      MYSQL_DATABASE: ${DB_NAME:-icnv}
      MYSQL_USER: ${DB_USER:-icnv}
      MYSQL_PASSWORD: ${DB_PASSWORD:-senha-forte-do-banco}
    volumes:
      - icnv_mysql_data:/var/lib/mysql
      # Opcional: importa schema na primeira subida (app também cria tabelas sozinho)
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      # Exponha só em dev; em produção no EasyPanel deixe sem ports externos
      - "${MYSQL_PUBLISH_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_troque_esta_senha}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - icnv_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: icnv-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      APP_URL: ${APP_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      PASSWORD_HASH_ALGORITHM: argon2id
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-icnv}
      DB_PASSWORD: ${DB_PASSWORD:-senha-forte-do-banco}
      DB_NAME: ${DB_NAME:-icnv}
      UPLOAD_DIR: /app/uploads
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5242880}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost}
      SERVER_PRESET: node-server
    volumes:
      # Uploads persistentes (imagens do CMS)
      - icnv_uploads:/app/uploads
    ports:
      - "${APP_PUBLISH_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - icnv_net

volumes:
  icnv_mysql_data:
  icnv_uploads:

networks:
  icnv_net:
    driver: bridge
